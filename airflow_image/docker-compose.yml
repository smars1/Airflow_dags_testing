x-airflow-environment: &airflow-environment
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  #AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
  AIRFLOW__DAG_DEFAULT_VIEW: graph
  


  AIRFLOW__SMTP__SMTP_HOST: ${AIRFLOW__SMTP__SMTP_HOST}
  AIRFLOW__SMTP__SMTP_STARTTLS: 'True'
  AIRFLOW__SMTP__SMTP_SSL: 'False'
  AIRFLOW__SMTP__SMTP_USER: ${AIRFLOW__SMTP__SMTP_USER}
  AIRFLOW__SMTP__SMTP_PASSWORD: ${AIRFLOW__SMTP__SMTP_PASSWORD}
  AIRFLOW__SMTP__SMTP_PORT: ${AIRFLOW__SMTP__SMTP_PORT}
  AIRFLOW__SMTP__SMTP_MAIL_FROM: ${AIRFLOW__SMTP__SMTP_MAIL_FROM}

services:
  postgres:
    image: postgres:11.5
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: airflow
    ports:
      - "5432:5432"

  init:
    build: .  # Construye la imagen utilizando el Dockerfile en el directorio actual
    environment:
      <<: *airflow-environment
    depends_on:
      - postgres
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
    entrypoint: /bin/sh
    command: -c "
      airflow db init &&
      (airflow users list | grep 'No data found' && airflow users create --role Admin --username ${AIRFLOW_USER} --password ${AIRFLOW_PASSWORD} -e airflow@airflow.com -f airflow -l airflow || echo 'User already exists') &&
      exit 0"
    restart: on-failure

  db-upgrade:
    build: .  # Construye la imagen utilizando el Dockerfile en el directorio actual
    environment:
      <<: *airflow-environment
    depends_on:
      - postgres
    entrypoint: /bin/sh
    command: -c "airflow db upgrade"
    restart: "no"

  webserver:
    build: .  # Construye la imagen utilizando el Dockerfile en el directorio actual
    ports:
      - 8080:8080
    environment:
      <<: *airflow-environment
    depends_on:
      - db-upgrade
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./variables_test.json:/opt/airflow/variables_test.json
    entrypoint: /bin/sh
    command: -c "airflow webserver"
    restart: always

  scheduler:
    build: .  # Construye la imagen utilizando el Dockerfile en el directorio actual
    environment:
      <<: *airflow-environment
    depends_on:
      - db-upgrade
    volumes:
      - ./dags:/opt/airflow/dags
      - ./plugins:/opt/airflow/plugins
      - ./logs:/opt/airflow/logs
      - ./variables_test.json:/opt/airflow/variables_test.json
    entrypoint: /bin/sh
    command: -c "airflow scheduler"
    restart: always
